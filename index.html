<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px;padding-top:15px}
#bar{height:10px;background:#00ff88;width:0%;position:fixed;top:0;left:0;z-index:9999}
.card{background:#111;border-radius:15px;padding:10px;margin-top:15px}
img,video{width:100%;border-radius:12px;margin-top:8px}
button{border:none;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin-top:8px;box-sizing:border-box}
#publishBtn{width:100%;padding:15px;background:#ff0055;color:#fff;font-size:17px;margin-top:10px}
</style>
</head>
<body>
<div id="bar"></div>
<h1 style="text-align:center">⚡ PULSE</h1>
<p style="text-align:center;color:#aaa">Everyone Worldwide Will See It</p>
<input type="file" id="fileInput" accept="image/*,video/*">
<textarea id="caption" placeholder="Write caption..."></textarea>
<button id="publishBtn" onclick="publishPost()">Publish Globally 🚀</button>
<p id="publishText" style="text-align:center"></p>
<p style="text-align:center;color:#888;font-size:12px">Videos up to 30 seconds work</p>
<div id="feed"></div>
<script>
const DB = "https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses.json";
function loadFeed(){fetch(DB).then(r=>r.json()).then(data=>{let feed=document.getElementById('feed');feed.innerHTML='';if(!data)return;Object.keys(data).reverse().forEach(id=>{let p=data[id];feed.innerHTML+=`<div class="card"><b>@pulse_user</b><p>${p.caption||''}</p>${p.media?(p.type&&p.type.includes('video')?`<video src="${p.media}" controls></video>`:`<img src="${p.media}">`):''}<br><br><button onclick="likePost('${id}',${p.likes||0})">❤️ ${p.likes||0} Like</button> <button onclick="commentPost('${id}')">💬 Comment</button><div>${(p.comments||[]).map(c=>`<p>💬 ${c}</p>`).join('')}</div></div>`;});});}
loadFeed();setInterval(loadFeed,5000);
function likePost(id,likes){fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({likes:likes+1})}).then(()=>loadFeed());}
function commentPost(id){let t=prompt("Write comment:");if(!t)return;fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`).then(r=>r.json()).then(p=>{let c=p.comments||[];c.push(t);fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({comments:c})}).then(()=>loadFeed());});}
function compressImage(file, cb){
  let r=new FileReader();
  r.onload=e=>{
    let img=new Image();
    img.onload=()=>{
      let canvas=document.createElement('canvas');
      let max=800; let w=img.width, h=img.height;
      if(w>max){h=h*max/w; w=max;} if(h>max){w=w*max/h; h=max;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.7));
    }; img.src=e.target.result;
  }; r.readAsDataURL(file);
}
function compressVideo(file, cb, onFail){
  let url=URL.createObjectURL(file);
  let video=document.createElement('video');
  video.muted=true; video.playsInline=true; video.src=url;
  video.onloadedmetadata=()=>{
    let maxW=360;
    let scale=Math.min(1, maxW/video.videoWidth);
    let w=Math.floor(video.videoWidth*scale);
    let h=Math.floor(video.videoHeight*scale);
    let canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    let ctx=canvas.getContext('2d');
    let stream=canvas.captureStream(24);
    let recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:400000});
    let chunks=[];
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{
      let blob=new Blob(chunks,{type:'video/webm'});
      if(blob.size>3500000){ onFail(); return; }
      let r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(blob);
    };
    video.onplay=()=>{
      function draw(){ if(video.ended||video.paused){return;} ctx.drawImage(video,0,0,w,h); requestAnimationFrame(draw); }
      draw();
    };
    video.onended=()=>{ setTimeout(()=>{ try{recorder.stop();}catch(e){} },200); };
    video.play().then(()=>{ recorder.start(); });
    setTimeout(()=>{ if(recorder.state!=='inactive'){ try{recorder.stop();}catch(e){} video.pause(); onFail(); } },35000);
  };
  video.onerror=()=>onFail();
}
function publishPost(){
  let btn=document.getElementById('publishBtn');
  let bar=document.getElementById('bar');
  let txt=document.getElementById('publishText');
  let caption=document.getElementById('caption').value;
  let file=document.getElementById('fileInput').files[0];
  btn.disabled=true; btn.innerText='Publishing... Please Wait ⏳'; btn.style.opacity='0.6';
  txt.innerText='Uploading 10%...'; bar.style.width='10%';
  let p=10;
  let timer=setInterval(()=>{p+=15; if(p>=90){p=90; clearInterval(timer); txt.innerText='Almost done 90%...';} else {txt.innerText='Uploading '+p+'%...';} bar.style.width=p+'%';},300);
  function finish(media,type){
    fetch(DB,{method:'POST',body:JSON.stringify({caption,media:media||'',type:type||'',likes:0,comments:[]})}).then(()=>{
      clearInterval(timer); bar.style.width='100%'; txt.innerText='Published 100% ✓';
      btn.innerText='Publish Globally 🚀'; btn.disabled=false; btn.style.opacity='1';
      document.getElementById('caption').value=''; document.getElementById('fileInput').value='';
      loadFeed();
      setTimeout(()=>{bar.style.width='0%'; txt.innerText='';},2000);
    }).catch(()=>{ clearInterval(timer); txt.innerText='Failed - try shorter video'; btn.disabled=false; btn.innerText='Publish Globally 🚀'; });
  }
  function failVideo(){
    clearInterval(timer); bar.style.width='0%'; txt.innerText='❌ Video still too big. Try 30 seconds or less.';
    btn.disabled=false; btn.innerText='Publish Globally 🚀'; btn.style.opacity='1';
  }
  if(file){
    if(file.type.includes('image')){ compressImage(file,(small)=>{ finish(small,'image/jpeg'); }); }
    else if(file.type.includes('video')){ txt.innerText='Compressing video... please wait'; compressVideo(file,(small)=>{ finish(small,'video/webm'); }, failVideo); }
    else { let r=new FileReader(); r.onload=e=>finish(e.target.result,file.type); r.readAsDataURL(file); }
  } else { finish('',''); }
}
</script>
</body>
</html>
