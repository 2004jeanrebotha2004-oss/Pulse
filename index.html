<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;margin:0}
h1{color:#00ff88;text-align:center}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#222;color:#fff;border:1px solid #333;border-radius:10px;box-sizing:border-box}
button{background:#00ff88;color:#000;border:0;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
img,video{max-width:100%;border-radius:12px}
.pfp{width:40px;height:40px;border-radius:50%;object-fit:cover}
.bigpfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #00ff88}
#bar{height:8px;background:#00ff88;width:0%;border-radius:10px;transition:width .3s}
#barWrap{background:#222;border-radius:10px;overflow:hidden;margin:8px 0}
</style>
</head>
<body>
<h1>⚡ PULSE</h1>
<div id="profileArea"></div>
<div class="card">
<textarea id="caption" placeholder="What's happening?"></textarea>
<input type="file" id="fileInput" accept="image/*,video/*">
<button id="publishBtn" onclick="publishPost()" style="width:100%">Publish Globally 🚀</button>
<div id="barWrap"><div id="bar"></div></div>
<p id="publishText" style="text-align:center;font-size:13px;color:#aaa"></p>
</div>
<button onclick="loadFeed()" style="width:100%;background:#222;color:#fff">🔄 Refresh Feed</button>
<div id="feed"></div>
<script>
const DB='https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses.json';
let currentUser=JSON.parse(localStorage.getItem('pulse_user')||'null');
let allProfiles={};
let myTotalLikes=0;
function compressImage(file,cb,maxW,quality){
  let r=new FileReader();r.onload=e=>{
    let img=new Image();img.onload=()=>{
      let c=document.createElement('canvas');
      let scale=Math.min(1,maxW/img.width);
      c.width=img.width*scale;c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',quality));
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}
function loadProfiles(cb){
  fetch('https://pulse-v2-707c2-default-rtdb.firebaseio.com/profiles.json').then(r=>r.json()).then(d=>{
    allProfiles=d||{};
    if(currentUser && allProfiles[currentUser.username]){ currentUser=allProfiles[currentUser.username]; localStorage.setItem('pulse_user',JSON.stringify(currentUser)); }
    if(cb)cb();
  }).catch(()=>{if(cb)cb();});
}
function renderProfile(){
  let a=document.getElementById('profileArea');
  if(!currentUser){
    a.innerHTML=`<div class="card"><h3>Create Your Profile</h3>
    <input id="newUsername" placeholder="Choose username (no spaces)">
    <input id="newBio" placeholder="Your bio...">
    <p style="font-size:13px;color:#aaa">Profile photo:</p>
    <input type="file" id="newPfp" accept="image/*">
    <button onclick="saveProfile()" style="width:100%">Create Profile ✅</button></div>`;
    return;
  }
  let followers=(currentUser.followers||[]).length;
  let following=(currentUser.following||[]).length;
  a.innerHTML=`<div class="card" style="text-align:center">
<img class="bigpfp" src="${currentUser.pfp||'https://via.placeholder.com/90'}">
  <h2 style="margin:8px 0 2px">@${currentUser.username}</h2>
  <p style="color:#aaa;margin:0">${currentUser.bio||''}</p>
  <p><b id="myPostsCount">0</b> Posts • <b>${followers}</b> Followers • <b>${following}</b> Following • <b id="myLikesCount">0</b> Likes</p>
  <button onclick="editProfile()" style="background:#222;color:#fff">Edit Profile ✏️</button>
  <button onclick="logout()" style="background:#ff0055;color:#fff">Log Out</button>
  </div>`;
}
function editProfile(){
  let a=document.getElementById('profileArea');
  a.innerHTML=`<div class="card"><h3>Edit Profile</h3>
  <input id="newBio" placeholder="Your bio..." value="${currentUser.bio||''}">
  <p style="font-size:13px;color:#aaa">Change photo (optional):</p>
  <input type="file" id="newPfp" accept="image/*">
  <button onclick="saveProfile(true)" style="width:100%">Save Changes ✅</button>
  <button onclick="renderProfile()" style="width:100%;background:#222;color:#fff;margin-top:6px">Cancel</button></div>`;
}
function logout(){localStorage.removeItem('pulse_user');currentUser=null;renderProfile();loadFeed();}
function saveProfile(isEdit){
  let bio=document.getElementById('newBio').value;
  let file=document.getElementById('newPfp').files[0];
  let username=isEdit?currentUser.username:document.getElementById('newUsername').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!isEdit && !username){alert('Choose a username');return;}
  function doSave(pfp){
    let user={username,bio,pfp:pfp||currentUser?.pfp||'',followers:currentUser?.followers||[],following:currentUser?.following||[]};
    currentUser=user;localStorage.setItem('pulse_user',JSON.stringify(user));
    fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/profiles/${username}.json`,{method:'PUT',body:JSON.stringify(user)}).then(()=>{renderProfile();loadFeed();});
  }
  if(file){compressImage(file,(s)=>doSave(s),600,0.85);} else {doSave('');}
}
let allFeedIds=[];
let allFeedData={};
let feedShown=0;
function loadFeed(){
  let feed=document.getElementById('feed');
  feed.innerHTML='<p style="text-align:center;color:#aaa">Loading feed... ⚡</p>';
  feedShown=0;
  fetch(DB).then(r=>r.json()).then(data=>{
    feed.innerHTML='';
    if(!data){feed.innerHTML='<p style="text-align:center">No posts yet - be first!</p>';return;}
    allFeedData=data;
    allFeedIds=Object.keys(data).reverse();
    renderNextBatch();
  });
}
function renderNextBatch(){
  let feed=document.getElementById('feed');
  let oldBtn=document.getElementById('loadMoreBtn');
  if(oldBtn) oldBtn.remove();
  let myPosts=0; myTotalLikes=0;
  Object.keys(allFeedData).forEach(id=>{
    let p=allFeedData[id];
    if(currentUser && p.author===currentUser.username){ myPosts++; myTotalLikes+=(p.likes||0); }
  });
  let likesEl=document.getElementById('myLikesCount'); if(likesEl) likesEl.innerText=myTotalLikes;
  let postsEl=document.getElementById('myPostsCount'); if(postsEl) postsEl.innerText=myPosts;
  let batch = allFeedIds.slice(feedShown, feedShown+10);
  batch.forEach(id=>{
    let p=allFeedData[id];
    let author=p.author||'pulse_user';
    let authorPic=p.authorPic||'https://via.placeholder.com/40';
    let isMe = currentUser && author===currentUser.username;
    let meFollowing = currentUser && allProfiles[currentUser.username] ? (allProfiles[currentUser.username].following||[]) : [];
    let isFollowing = meFollowing.includes(author);
    let followBtn = !currentUser ? '' : isMe ? '<span style="font-size:12px;color:#888">• You</span>' : `<button onclick="followUser('${author}',this)" style="padding:6px 10px;background:${isFollowing?'#222':'#00ff88'};color:${isFollowing?'#fff':'#000'};font-size:12px">${isFollowing?'✓ Following':'＋ Follow'}</button>`;
    let deleteBtn = isMe ? `<button onclick="deletePost('${id}')" style="padding:6px 10px;background:#ff0055;color:#fff;font-size:12px;margin-left:auto">🗑️ Delete</button>` : '';
    let mediaHtml='';
    if(p.media){
      if(p.type&&p.type.includes('video')) mediaHtml=`<video src="${p.media}" controls playsinline preload="none" style="width:100%;border-radius:12px;margin-top:8px"></video>`;
      else mediaHtml=`<img src="${p.media}" loading="lazy" style="width:100%;border-radius:12px;margin-top:8px">`;
    }
    feed.innerHTML+=`<div class="card">
      <div style="display:flex;align-items:center;gap:8px">
        <img class="pfp" src="${authorPic}" loading="lazy"><b>@${author}</b> ${followBtn} ${deleteBtn}
      </div>
      <p>${p.caption||''}</p>
      ${mediaHtml}
      <br><br><button onclick="likePost('${id}',${p.likes||0},this)">❤️ ${p.likes||0} Like</button> <button onclick="commentPost('${id}')">💬 Comment</button>
      <div>${(p.comments||[]).map(c=>`<p>💬 ${c}</p>`).join('')}</div></div>`;
  });
  feedShown+=batch.length;
  if(feedShown < allFeedIds.length){
    feed.innerHTML+=`<button id="loadMoreBtn" onclick="renderNextBatch()" style="width:100%;background:#222;color:#fff;margin-top:10px">Load More ⬇️</button>`;
  }
}
window.addEventListener('scroll', ()=>{
  if((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 500){
    let btn=document.getElementById('loadMoreBtn');
    if(btn) renderNextBatch();
  }
});
function deletePost(id){
  if(!confirm('Delete this post? This cannot be undone.')) return;
  fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'DELETE'}).then(()=>{ loadFeed(); });
}
function followUser(author,btn){
  if(!currentUser){alert('Create a profile first');return;}
  if(author===currentUser.username) return;
  loadProfiles(()=>{
    let me = allProfiles[currentUser.username]||currentUser;
    let them = allProfiles[author]||{username:author,followers:[],following:[]};
    me.following = me.following||[]; them.followers = them.followers||[];
    let isFollowing = me.following.includes(author);
    if(isFollowing){
      me.following = me.following.filter(u=>u!==author);
      them.followers = them.followers.filter(u=>u!==currentUser.username);
      btn.innerText='＋ Follow'; btn.style.background='#00ff88'; btn.style.color='#000';
    } else {
      me.following.push(author); them.followers.push(currentUser.username);
      btn.innerText='✓ Following'; btn.style.background='#222'; btn.style.color='#fff';
    }
    localStorage.setItem('pulse_user',JSON.stringify(me));
    allProfiles[currentUser.username]=me; allProfiles[author]=them;
    fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/profiles/${currentUser.username}.json`,{method:'PUT',body:JSON.stringify(me)});
    fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/profiles/${author}.json`,{method:'PUT',body:JSON.stringify(them)}).then(()=>renderProfile());
  });
}
function likePost(id,likes,btn){btn.innerText='❤️ '+(likes+1)+' Like';fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({likes:likes+1})});}
function commentPost(id){let t=prompt("Write comment:");if(!t)return;let el=document.createElement('p');el.innerText='💬 '+t;event.target.parentElement.appendChild(el);fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`).then(r=>r.json()).then(p=>{let c=p.comments||[];c.push(t);fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({comments:c})});});}
function publishPost(){
  if(!currentUser){alert('Create your profile first!');return;}
  let btn=document.getElementById('publishBtn');let bar=document.getElementById('bar');let txt=document.getElementById('publishText');
  let caption=document.getElementById('caption').value;let file=document.getElementById('fileInput').files[0];
  function resetBtn(){btn.disabled=false;btn.innerText='Publish Globally 🚀';btn.style.opacity='1';}
  function failVideo(msg){bar.style.width='0%';txt.innerText=msg;resetBtn();}
  function doUpload(media,type){
    btn.disabled=true;btn.innerText='Publishing... Please Wait ⏳';btn.style.opacity='0.6';
    txt.innerText='Uploading...';bar.style.width='50%';
    fetch(DB,{method:'POST',body:JSON.stringify({caption,media:media||'',type:type||'',likes:0,comments:[],author:currentUser.username,authorPic:currentUser.pfp||''})}).then(()=>{
      bar.style.width='100%';txt.innerText='Published 100% ✓';resetBtn();
      document.getElementById('caption').value='';document.getElementById('fileInput').value='';loadFeed();
      setTimeout(()=>{bar.style.width='0%';txt.innerText='';},2000);
    }).catch(()=>{ failVideo('❌ Failed - check internet and try again'); });
  }
  if(!file){ doUpload('',''); return; }
  if(file.type.includes('image')){ compressImage(file,(s)=>doUpload(s,'image/jpeg'),1280,0.88); return; }
  if(file.type.includes('video')){
    let url=URL.createObjectURL(file);
    let v=document.createElement('video');
    v.preload='metadata'; v.src=url;
    v.onloadedmetadata=()=>{
      URL.revokeObjectURL(url);
      if(v.duration>30){
        failVideo('❌ Video too long - must be 30 seconds or less. Trim it and try again.');
        return;
      }
      if(file.size>9000000){
        failVideo('❌ Video file too big. Send it via WhatsApp first to shrink it, then upload that version.');
        return;
      }
      txt.innerText='Uploading video... keep tab open';
      bar.style.width='10%';
      let r=new FileReader(); r.onload=e=>doUpload(e.target.result,file.type); r.readAsDataURL(file);
    };
    v.onerror=()=>{ failVideo('❌ Could not read video. Try another video.'); };
    return;
  }
  let r=new FileReader(); r.onload=e=>doUpload(e.target.result,file.type); r.readAsDataURL(file);
}
loadProfiles(()=>{renderProfile();loadFeed();});
</script>
</body>
</html>
