<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px;padding-top:15px}
#bar{height:10px;background:#00ff88;width:0%;position:fixed;top:0;left:0;z-index:9999}
.card{background:#111;border-radius:15px;padding:10px;margin-top:15px}
img,video{width:100%;border-radius:12px;margin-top:8px}
button{border:none;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin-top:8px;box-sizing:border-box}
#publishBtn{width:100%;padding:15px;background:#ff0055;color:#fff;font-size:17px;margin-top:10px}
</style>
</head>
<body>
<div id="bar"></div>
<h1 style="text-align:center">⚡ PULSE</h1>
<p style="text-align:center;color:#aaa">Everyone Worldwide Will See It</p>
<input type="file" id="fileInput" accept="image/*,video/*">
<textarea id="caption" placeholder="Write caption..."></textarea>
<button id="publishBtn" onclick="publishPost()">Publish Globally 🚀</button>
<p id="publishText" style="text-align:center"></p>
<p style="text-align:center;color:#888;font-size:12px">Videos up to 30 seconds with sound</p>
<button onclick="loadFeed()" style="width:100%;background:#222;color:#fff;margin-top:5px">🔄 Refresh Feed</button>
<div id="feed"></div>
<script>
const DB = "https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses.json";
function loadFeed(){fetch(DB).then(r=>r.json()).then(data=>{let feed=document.getElementById('feed');feed.innerHTML='';if(!data)return;Object.keys(data).reverse().forEach(id=>{let p=data[id];feed.innerHTML+=`<div class="card"><b>@pulse_user</b><p>${p.caption||''}</p>${p.media?(p.type&&p.type.includes('video')?`<video src="${p.media}" controls playsinline preload="metadata"></video>`:`<img src="${p.media}">`):''}<br><br><button onclick="likePost('${id}',${p.likes||0})">❤️ ${p.likes||0} Like</button> <button onclick="commentPost('${id}')">💬 Comment</button><div>${(p.comments||[]).map(c=>`<p>💬 ${c}</p>`).join('')}</div></div>`;});});}
loadFeed();
// NO auto-refresh anymore - this was restarting your videos every 5 seconds
function likePost(id,likes){fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({likes:likes+1})}).then(()=>loadFeed());}
function commentPost(id){let t=prompt("Write comment:");if(!t)return;fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`).then(r=>r.json()).then(p=>{let c=p.comments||[];c.push(t);fetch(`https://pulse-v2-707c2-default-rtdb.firebaseio.com/pulses/${id}.json`,{method:'PATCH',body:JSON.stringify({comments:c})}).then(()=>loadFeed());});}
function compressImage(file, cb){
  let r=new FileReader();
  r.onload=e=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let max=800;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}if(h>max){w=w*max/h;h=max;}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);cb(canvas.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(file);
}
function compressVideo(file, cb, onFail){
  if(file.size < 3500000){
    let r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); return;
  }
  let url=URL.createObjectURL(file);
  let video=document.createElement('video');
  video.style.cssText='position:fixed;left:-9999px;top:0;width:320px;';
  video.muted=false; video.volume=0; video.playsInline=true; video.src=url;
  document.body.appendChild(video);
  video.onloadedmetadata=()=>{
    if(!video.duration || video.duration>32){ video.remove(); onFail(); return; }
    let stream;
    try{ stream=video.captureStream(); }catch(e){ video.remove(); onFail(); return; }
    let mime='video/webm;codecs=vp9,opus';
    if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
    let recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000,audioBitsPerSecond:64000});
    let chunks=[]; let stopped=false;
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    function doStop(){ if(stopped) return; stopped=true; try{recorder.stop();}catch(e){} video.pause(); }
    recorder.onstop=()=>{
      video.remove();
      let blob=new Blob(chunks,{type:'video/webm'});
      if(blob.size>3800000 || blob.size<10000){ onFail(); return; }
      let r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(blob);
    };
    video.onended=()=>{ setTimeout(doStop,400); };
    video.onerror=()=>{ video.remove(); onFail(); };
    video.currentTime=0;
    video.play().then(()=>{ recorder.start(250); }).catch(()=>{ video.remove(); onFail(); });
    setTimeout(doStop, (video.duration*1000)+2000);
  };
  video.onerror=()=>{ video.remove(); onFail(); };
}
function publishPost(){
  let btn=document.getElementById('publishBtn');let bar=document.getElementById('bar');let txt=document.getElementById('publishText');
  let caption=document.getElementById('caption').value;let file=document.getElementById('fileInput').files[0];
  btn.disabled=true;btn.innerText='Publishing... Please Wait ⏳';btn.style.opacity='0.6';
  txt.innerText='Uploading 10%...';bar.style.width='10%';
  let p=10;let timer=setInterval(()=>{p+=8;if(p>=90){p=90;clearInterval(timer);txt.innerText='Almost done 90%...';}else{txt.innerText='Uploading '+p+'%...';}bar.style.width=p+'%';},500);
  function finish(media,type){fetch(DB,{method:'POST',body:JSON.stringify({caption,media:media||'',type:type||'',likes:0,comments:[]})}).then(()=>{clearInterval(timer);bar.style.width='100%';txt.innerText='Published 100% ✓';btn.innerText='Publish Globally 🚀';btn.disabled=false;btn.style.opacity='1';document.getElementById('caption').value='';document.getElementById('fileInput').value='';loadFeed();setTimeout(()=>{bar.style.width='0%';txt.innerText='';},2000);}).catch(()=>{clearInterval(timer);txt.innerText='Failed - try shorter video';btn.disabled=false;btn.innerText='Publish Globally 🚀';});}
  function failVideo(){clearInterval(timer);bar.style.width='0%';txt.innerText='❌ Video still too big. Try 25 seconds or less, or trim in Gallery.';btn.disabled=false;btn.innerText='Publish Globally 🚀';btn.style.opacity='1';}
  if(file){
    if(file.type.includes('image')){compressImage(file,(s)=>finish(s,'image/jpeg'));}
    else if(file.type.includes('video')){txt.innerText='Compressing video... please wait, keep this tab open';compressVideo(file,(s)=>finish(s,'video/webm'),failVideo);}
    else{let r=new FileReader();r.onload=e=>finish(e.target.result,file.type);r.readAsDataURL(file);}
  } else {finish('','');}
}
</script>
</body>
</html>
