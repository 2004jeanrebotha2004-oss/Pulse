<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Clock</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f172a;color:white;text-align:center}
header{padding:14px;background:#1e293b;font-size:22px;font-weight:bold}
header span{color:#22c55e}
#clock{font-size:52px;font-weight:bold;margin:10px 0 0}
#date{color:#94a3b8;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;max-width:900px;margin:auto}
.card{background:#1e293b;border-radius:14px;padding:12px}
.card h3{margin:4px 0 8px;font-size:18px}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px}
.in{background:#22c55e;color:#000}.late{background:#f97316;color:#000}.out{background:#334155}.not{background:#475569}
.pinbox{max-width:420px;margin:10px auto;background:#1e293b;padding:16px;border-radius:14px}
input{width:100%;padding:14px;font-size:22px;text-align:center;border-radius:10px;border:none;margin:8px 0}
button{width:100%;padding:14px;font-size:18px;font-weight:bold;border:none;border-radius:10px;background:#22c55e;cursor:pointer}
button.smallbtn{width:auto;padding:10px 14px;font-size:14px;background:#334155;color:white}
button.active{background:#22c55e;color:#000}
button.out{background:#f97316}
.small{font-size:13px;color:#94a3b8}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:left;font-size:14px}
select,input[type=date]{padding:10px;border-radius:8px;border:none;font-size:15px}
.weekwrap{overflow-x:auto}
</style>
</head>
<body>
<header>⚡ PULSE <span>CLOCK</span> <span id="modeLabel" style="font-size:13px;color:#94a3b8"></span></header>
<div id="clock">--:--:--</div>
<div id="date"></div>
<div id="wallView">
<div class="pinbox">
<h3 style="margin:0">Enter PIN to Clock IN / OUT</h3>
<input id="pinInput" inputmode="numeric" placeholder="****" maxlength="4">
<button onclick="doClock()">CLOCK IN / OUT</button>
<p class="small" id="msg">Late = after 08:00</p>
</div>
<div class="grid" id="wallGrid"></div>
</div>
<div id="bossView" style="display:none;max-width:980px;margin:auto;padding:12px">
<button onclick="enableNoti()" style="background:#facc15;color:#000;margin-bottom:12px">🔔 Turn ON Pop-up Notifications</button>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px">
<button class="smallbtn active" id="btnDay" onclick="showDayView()">📅 Daily</button>
<button class="smallbtn" id="btnWeek" onclick="showWeekView()">📊 Weekly Report (Mon-Fri)</button>
</div>
<div id="dayView">
<div style="display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px">
<button class="smallbtn" onclick="changeDay(-1)">← Prev</button>
<input type="date" id="bossDate">
<button class="smallbtn" onclick="changeDay(1)">Next →</button>
<button class="smallbtn" onclick="goToday()">Today</button>
</div>
<p id="dayTitle" style="font-weight:bold"></p>
<table><thead><tr><th>Worker</th><th>Status</th><th>Time</th></tr></thead><tbody id="bossBody"></tbody></table>
</div>
<div id="weekView" style="display:none">
<div style="display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px">
<button class="smallbtn" onclick="changeWeek(-1)">← Prev Week</button>
<span id="weekTitle" style="font-weight:bold"></span>
<button class="smallbtn" onclick="changeWeek(1)">Next Week →</button>
</div>
<div class="weekwrap"><table><thead><tr><th>Worker</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Total Hours</th></tr></thead><tbody id="weekBody"></tbody></table></div>
<p class="small">Mon-Fri only. Green = On Time, Orange = Late, Grey = Absent. Hours = OUT minus IN.</p>
<button onclick="shareWeek()" style="background:#22c55e;margin-top:12px">📤 Share Weekly Report</button>
</div>
<p class="small">Live - updates instantly. Late = after 08:00</p>
</div>
<script>
function tick(){
  var d=new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("en-ZA");
  document.getElementById("date").textContent = d.toDateString();
}
setInterval(tick,1000); tick();
var params = new URLSearchParams(location.search);
var isBoss = params.get("mode")==="boss";
document.getElementById("modeLabel").textContent = isBoss ? "• BOSS VIEW" : "• WALL CLOCK";
